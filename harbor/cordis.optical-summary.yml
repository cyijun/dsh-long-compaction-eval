- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-flash-vision-exp
        inputModalities: [text, image]

- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'
  config:
    dshHome: !!js process.env.DSH_HOME ?? '/tmp/dsh-long-compaction-eval'

- id: subprocess-local
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash-local
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.cwd()
    timeoutMs: 60000

- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp
    dshHome: !!js process.env.DSH_HOME ?? '/tmp/dsh-long-compaction-eval'
    persistenceRoot: !!js process.env.DSH_EVAL_SESSION_ROOT ?? '/tmp/dsh-long-compaction-eval/sessions'
    persistenceCompression: none
    workspaceContext: false
    goals: false
    persona: |
      You are a coding agent powered by {{model}}. Work in {{cwd}}. Complete the task, verify the result, and report only evidence-backed outcomes.

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-optical
  name: dsh-compaction-optical
  config:
    mode: summary
    thresholdRatio: !!js "Number(process.env.DSH_COMPACTION_THRESHOLD_RATIO ?? '0.8')"
    retainRatio: !!js "Number(process.env.DSH_COMPACTION_RETAIN_RATIO ?? '0.16')"
    maxTokens: 8192
    compactionRetries: 1
    maxPages: !!js "Number(process.env.DSH_OPTICAL_MAX_PAGES ?? '8')"
    maxGeneration: !!js "Number(process.env.DSH_OPTICAL_MAX_GENERATION ?? '1')"
